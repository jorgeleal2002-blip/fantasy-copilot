name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # The shared draft room's database, if one is configured.
      #
      # A repo VARIABLE by preference, not a secret: a Realtime Database URL is
      # public by design — it goes to every browser that loads the app — and
      # the rules in the database, not the secrecy of the URL, are what protect
      # it. With neither set the build simply omits the feature.
      #
      # But it reads BOTH, because "Secrets and variables → Actions" puts the
      # two tabs side by side with Secrets open first, and a URL saved one tab
      # to the left produces a build with no room in it and no error anywhere
      # to say why. Nothing is lost by accepting either: a secret holding a
      # public URL is just a variable with the logs masked.
      - run: npm run build
        env:
          VITE_RTDB_URL: ${{ vars.VITE_RTDB_URL || secrets.VITE_RTDB_URL }}
          # The two halves of signing in with Google. Neither is a secret in
          # any real sense — a web client id and a Firebase web API key are
          # both shipped to every browser that loads the page, and both
          # authorise nothing on their own; what guards the data is the
          # database's rules. Read from either tab for the same reason as
          # above. With either one missing the button is simply not drawn.
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID || secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GIPHY_KEY: ${{ vars.VITE_GIPHY_KEY || secrets.VITE_GIPHY_KEY }}
          VITE_FIREBASE_KEY: ${{ vars.VITE_FIREBASE_KEY || secrets.VITE_FIREBASE_KEY }}
      # enablement: true turns Pages on for the repo the first time this runs,
      # instead of failing with "Get Pages site failed / Not Found".
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
